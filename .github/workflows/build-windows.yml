name: Build Windows VST3

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target Meridian_VST3 --parallel

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Meridian-VST3-Windows
          path: build/Meridian_artefacts/Release/VST3/
